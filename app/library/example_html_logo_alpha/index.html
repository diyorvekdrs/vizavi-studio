<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(fonts/Poppins-Medium.ttf)}
#logo{position:absolute;left:220px;top:60px;width:200px;height:200px}
#w{position:absolute;left:0;right:0;top:270px;text-align:center;font:34px P;color:#fff;letter-spacing:8px}
</style></head><body><div id="stage"><img id="logo" src="assets/logo.png"><div id="w">VIZAVI</div></div>
<script src="vz.js"></script><script>
const lg=document.getElementById('logo'), w=document.getElementById('w');
VZ.onFrame(t=>{const p=VZ.prog(t,0,1.2,VZ.ease.outBack);lg.style.transform=`scale(${p}) rotate(${(1-p)*90}deg)`;
 w.style.opacity=VZ.prog(t,0.9,1.5,VZ.ease.out); w.style.letterSpacing=(8+20*(1-VZ.prog(t,0.9,1.8,VZ.ease.out)))+'px';});
</script></body></html>
